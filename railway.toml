# Railway Configuration
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.production"

[deploy]
# Don't override startCommand - let Dockerfile handle entrypoint
# startCommand is now in Dockerfile.production CMD
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "always"

[env]
NODE_ENV = "production"
PORT = "3000"
