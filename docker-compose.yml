services:
  db:
    image: postgres:16-alpine
    container_name: zauro_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zauro_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zauro_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/zauro_db
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # Let the image ENTRYPOINT handle Prisma and start the app
    command: ["node", "dist/main.js"]
    # For local dev with hot reload, you can mount and run start:dev
    # volumes:
    #   - .:/app
    #   - /app/node_modules

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: zauro_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  animal-detection:
    build:
      context: ./animal detection
      dockerfile: Dockerfile
    container_name: zauro_animal_detection
    ports:
      - "5000:5000"
    volumes:
      - "./animal detection:/app"
      - ml_models:/root/.cache/huggingface
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_APP=api.py
      - FLASK_ENV=production
    healthcheck:
      test: curl -f http://localhost:5000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  db_data:
  pgadmin_data:
  ml_models:
